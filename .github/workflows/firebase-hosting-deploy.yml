name: Firebase Hosting Deploy

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/firebase-hosting-deploy.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - "ops/verify-connect-release.mjs"
      - "ops/verify-shared-hub-rules.mjs"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".firebaserc"
      - "vite.config.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestjourney-firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Firebase Web configuration is public by design and shared with the MillionsNest Hub.
      VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
      VITE_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: millionsnest
      VITE_FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "555464791734"
      VITE_FIREBASE_APP_ID: "1:555464791734:web:3059e8ac2b8089a1767817"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Firebase Web config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_FIREBASE_API_KEY"
          test "$VITE_FIREBASE_PROJECT_ID" = "millionsnest"
          test -n "$VITE_FIREBASE_APP_ID"
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID"
          echo "NESTJOURNEY_FIREBASE_WEB_CONFIG_OK"
      - name: Validate
        run: npm run check
      # Shared project policy belongs exclusively to the canonical Hub pipeline.
      # Local NestJourney Rules are fixtures, never production deployment source.
      - name: Verify canonical Hub Rules (read-only, fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            'https://firebaserules.googleapis.com/v1/projects/millionsnest/releases/cloud.firestore' \
            -o /tmp/journey-hub-rules-release.json
          RULESET_NAME="$(jq -er '.rulesetName' /tmp/journey-hub-rules-release.json)"
          [[ "$RULESET_NAME" =~ ^projects/millionsnest/rulesets/[a-zA-Z0-9-]+$ ]]
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebaserules.googleapis.com/v1/$RULESET_NAME" \
            -o /tmp/journey-hub-rules-source.json
          node ops/verify-shared-hub-rules.mjs /tmp/journey-hub-rules-source.json
          rm /tmp/journey-hub-rules-release.json /tmp/journey-hub-rules-source.json
          unset ACCESS_TOKEN
      - name: Capture Hosting recovery and verify existing Connect boundary
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --max-time 30 --output /tmp/journey-core-auth.json --write-out '%{http_code}' -X POST 'https://connect.millionsnest.com/api/core/support/draft' -H 'Content-Type: application/json' --data '{"product":"nestjourney","organizationId":"release-smoke-synthetic","locale":"pt-BR"}')"
          test "$STATUS" = 401
          echo NESTJOURNEY_CONNECT_CORE_AUTH_BOUNDARY_OK
          gcloud run services get-iam-policy connect-api --project millionsnest --region us-central1 --format=json | jq -S . > /tmp/journey-core-iam-before.json
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $ACCESS_TOKEN" 'https://firebasehosting.googleapis.com/v1beta1/sites/mn-nestjourney-555464791734/releases?pageSize=1' > /tmp/journey-hosting-before.json
          VERSION="$(jq -er '.releases[0].version.name' /tmp/journey-hosting-before.json)"
          [[ "$VERSION" =~ ^sites/mn-nestjourney-555464791734/versions/[a-zA-Z0-9_-]+$ ]]
          echo "PREVIOUS_JOURNEY_HOSTING_VERSION=$VERSION" >> "$GITHUB_ENV"
          node --input-type=module -e "import fs from 'node:fs';if(!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA||''))process.exit(1);const body=JSON.stringify({schemaVersion:1,product:'nestjourney',releaseSha:process.env.GITHUB_SHA});fs.writeFileSync('dist/connect-release.json',body);fs.writeFileSync('dist/connect-release-'+process.env.GITHUB_SHA+'.json',body)"
          node ops/verify-connect-release.mjs dist/connect-release.json
          node ops/verify-connect-release.mjs "dist/connect-release-$GITHUB_SHA.json"
          echo "NESTJOURNEY_CONNECT_ARTIFACT_READY_SHA=$GITHUB_SHA"
      - name: Deploy Hosting
        run: |
          echo JOURNEY_HOSTING_RELEASE_STARTED=true >> "$GITHUB_ENV"
          npx -y firebase-tools@15.30.2 deploy --only hosting:nestjourney --project millionsnest --non-interactive
      - name: Smoke test Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://mn-nestjourney-555464791734.web.app/" -o /tmp/firebase-index.html
          grep -Eiq '<!doctype html|<html' /tmp/firebase-index.html
          grep -Fq '<title>NestJourney | MillionsNest</title>' /tmp/firebase-index.html
          test -s /tmp/firebase-index.html
          ASSET_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/firebase-index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$ASSET_PATH"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://mn-nestjourney-555464791734.web.app$ASSET_PATH" -o /tmp/firebase-app.js
          test -s /tmp/firebase-app.js
          echo "NESTJOURNEY_DEFAULT_HOSTING_ENTRY_ASSET_OK=$ASSET_PATH"
          custom_ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
              "https://nestjourney.millionsnest.com/?smoke=${GITHUB_SHA}-${attempt}" \
              -o /tmp/custom-domain-index.html 2>/dev/null \
              && grep -Eiq '<!doctype html|<html' /tmp/custom-domain-index.html \
              && grep -Fq '<title>NestJourney | MillionsNest</title>' /tmp/custom-domain-index.html; then
              custom_ready=1
              break
            fi
            echo "Waiting for NestJourney custom domain propagation (attempt ${attempt}/20)" >&2
            sleep 5
          done
          test "$custom_ready" = "1"
          echo "FIREBASE_HOSTING_SMOKE_OK=NestJourney"
      - name: Verify support authority and exact published release
        shell: bash
        run: |
          set -euo pipefail
          for BASE in https://mn-nestjourney-555464791734.web.app https://nestjourney.millionsnest.com; do
            ready=0
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' "$BASE/connect-release.json?sha=$GITHUB_SHA-$attempt" > /tmp/journey-connect-release.json \
                && curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$BASE/connect-release-$GITHUB_SHA.json?attempt=$attempt" > /tmp/journey-connect-proof.json \
                && node ops/verify-connect-release.mjs /tmp/journey-connect-release.json \
                && node ops/verify-connect-release.mjs /tmp/journey-connect-proof.json; then
                ready=1
                break
              fi
              echo "Waiting for exact NestJourney release at $BASE ($attempt/20)"
              sleep 3
            done
            test "$ready" = 1
            echo "NESTJOURNEY_CONNECT_DOMAIN_EXACT_SHA_OK=$BASE"
            STATUS="$(curl --silent --show-error --max-time 30 --output /tmp/journey-connect-auth.json --write-out '%{http_code}' -X POST "$BASE/api/core/support/draft" -H 'Content-Type: application/json' --data '{"product":"nestjourney","organizationId":"release-smoke-synthetic","locale":"pt-BR"}')"
            test "$STATUS" = 401
          done
          gcloud run services get-iam-policy connect-api --project millionsnest --region us-central1 --format=json | jq -S . > /tmp/journey-core-iam-after.json
          cmp --silent /tmp/journey-core-iam-before.json /tmp/journey-core-iam-after.json
          echo NESTJOURNEY_CONNECT_CORE_IAM_UNCHANGED
          echo NESTJOURNEY_CONNECT_SUPPORT_AUTHORITY_OK
          echo "NESTJOURNEY_CONNECT_EXACT_RELEASE_SHA=$GITHUB_SHA"
      - name: Restore captured Hosting version on failure
        if: (failure() || cancelled()) && env.JOURNEY_HOSTING_RELEASE_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_JOURNEY_HOSTING_VERSION" =~ ^sites/mn-nestjourney-555464791734/versions/[a-zA-Z0-9_-]+$ ]]
          npx -y firebase-tools@15.30.2 hosting:clone "mn-nestjourney-555464791734@${PREVIOUS_JOURNEY_HOSTING_VERSION##*/}" 'mn-nestjourney-555464791734:live' --project millionsnest --non-interactive
          echo NESTJOURNEY_CONNECT_HOSTING_RESTORED
