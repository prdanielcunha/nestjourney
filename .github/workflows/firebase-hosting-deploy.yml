name: Firebase Hosting Deploy

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/firebase-hosting-deploy.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".firebaserc"
      - "vite.config.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestjourney-firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Firebase Web configuration is public by design and shared with the MillionsNest Hub.
      VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
      VITE_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: millionsnest
      VITE_FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "555464791734"
      VITE_FIREBASE_APP_ID: "1:555464791734:web:3059e8ac2b8089a1767817"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Firebase Web config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_FIREBASE_API_KEY"
          test "$VITE_FIREBASE_PROJECT_ID" = "millionsnest"
          test -n "$VITE_FIREBASE_APP_ID"
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID"
          echo "NESTJOURNEY_FIREBASE_WEB_CONFIG_OK"
      - name: Validate
        run: npm run check
      - name: Deploy Hosting
        run: npx -y firebase-tools@15.26.0 deploy --only hosting:nestjourney --project millionsnest --non-interactive
      - name: Smoke test Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://mn-nestjourney-555464791734.web.app/" -o /tmp/firebase-index.html
          grep -Eiq '<!doctype html|<html' /tmp/firebase-index.html
          grep -Fq '<title>NestJourney | MillionsNest</title>' /tmp/firebase-index.html
          test -s /tmp/firebase-index.html
          ASSET_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/firebase-index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$ASSET_PATH"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://mn-nestjourney-555464791734.web.app$ASSET_PATH" -o /tmp/firebase-app.js
          grep -Fq 'millionsnest.firebaseapp.com' /tmp/firebase-app.js
          grep -Fq '555464791734' /tmp/firebase-app.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://nestjourney.millionsnest.com/" -o /tmp/custom-domain-index.html
          grep -Fq '<title>NestJourney | MillionsNest</title>' /tmp/custom-domain-index.html
          echo "FIREBASE_HOSTING_SMOKE_OK=NestJourney"
