name: Firebase Hosting Deploy

on:
  push:
    branches: [ production ]
    paths:
      - ".github/workflows/firebase-hosting-deploy.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".firebaserc"
      - "vite.config.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nestjourney-firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Firebase Web configuration is public by design and shared with the MillionsNest Hub.
      VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs
      VITE_FIREBASE_AUTH_DOMAIN: millionsnest.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: millionsnest
      VITE_FIREBASE_STORAGE_BUCKET: millionsnest.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "555464791734"
      VITE_FIREBASE_APP_ID: "1:555464791734:web:3059e8ac2b8089a1767817"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Firebase Web config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_FIREBASE_API_KEY"
          test "$VITE_FIREBASE_PROJECT_ID" = "millionsnest"
          test -n "$VITE_FIREBASE_APP_ID"
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID"
          echo "NESTJOURNEY_FIREBASE_WEB_CONFIG_OK"
      - name: Validate
        run: npm run check
      - name: Deploy Firestore Rules
        shell: bash
        run: |
          set -uo pipefail

          # Prefer the supported Firebase CLI. The Rules service has returned
          # transient 503/409 responses in production, so retry before using
          # the documented Rules REST management API as a fail-closed fallback.
          for attempt in 1 2 3; do
            echo "Firestore Rules CLI attempt $attempt/3"
            if npx -y firebase-tools@15.30.2 deploy --only firestore:rules --project millionsnest --non-interactive; then
              echo "FIRESTORE_RULES_DEPLOY_OK=cli"
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "CLI retries exhausted; trying Firebase Rules REST management API."
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "source": {
                  "files": [{
                      "name": "firestore.rules",
                      "content": Path("firestore.rules").read_text(encoding="utf-8"),
                  }]
              }
          }
          Path("/tmp/ruleset-request.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          RULESET_NAME=""
          for attempt in 1 2 3 4 5; do
            TOKEN="$(gcloud auth print-access-token)"
            HTTP_CODE="$(curl --silent --show-error --output /tmp/ruleset-response.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/ruleset-request.json \
              "https://firebaserules.googleapis.com/v1/projects/millionsnest/rulesets" || true)"
            if [[ "$HTTP_CODE" =~ ^2 ]]; then
              RULESET_NAME="$(python - <<'PY'
          import json
          print(json.load(open("/tmp/ruleset-response.json")).get("name", ""))
          PY
              )"
              if [ -n "$RULESET_NAME" ]; then
                break
              fi
            fi
            echo "Rules REST ruleset attempt $attempt/5 returned HTTP $HTTP_CODE" >&2
            sleep $((attempt * 10))
          done

          if [ -z "$RULESET_NAME" ]; then
            echo "FIRESTORE_RULESET_CREATE_FAILED" >&2
            cat /tmp/ruleset-response.json >&2 || true
            exit 1
          fi

          RULESET_NAME="$RULESET_NAME" python - <<'PY'
          import json, os
          from pathlib import Path
          name = "projects/millionsnest/releases/cloud.firestore"
          payload = {
              "release": {
                  "name": name,
                  "rulesetName": os.environ["RULESET_NAME"],
              },
              "updateMask": "rulesetName",
          }
          Path("/tmp/release-request.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          RELEASE_OK=""
          for attempt in 1 2 3 4 5; do
            TOKEN="$(gcloud auth print-access-token)"
            HTTP_CODE="$(curl --silent --show-error --output /tmp/release-response.json --write-out '%{http_code}' \
              --request PATCH \
              --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/release-request.json \
              "https://firebaserules.googleapis.com/v1/projects/millionsnest/releases/cloud.firestore" || true)"
            if [[ "$HTTP_CODE" =~ ^2 ]]; then
              RELEASE_OK="yes"
              break
            fi
            echo "Rules REST release attempt $attempt/5 returned HTTP $HTTP_CODE" >&2
            sleep $((attempt * 10))
          done

          if [ "$RELEASE_OK" != "yes" ]; then
            echo "FIRESTORE_RULES_RELEASE_FAILED" >&2
            cat /tmp/release-response.json >&2 || true
            exit 1
          fi

          VERIFY_OK=""
          for attempt in 1 2 3 4 5; do
            TOKEN="$(gcloud auth print-access-token)"
            HTTP_CODE="$(curl --silent --show-error --output /tmp/release-verify.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $TOKEN" \
              "https://firebaserules.googleapis.com/v1/projects/millionsnest/releases/cloud.firestore" || true)"
            if [[ "$HTTP_CODE" =~ ^2 ]] && RULESET_NAME="$RULESET_NAME" python - <<'PY'
          import json, os, sys
          data = json.load(open("/tmp/release-verify.json"))
          sys.exit(0 if data.get("rulesetName") == os.environ["RULESET_NAME"] else 1)
          PY
            then
              VERIFY_OK="yes"
              break
            fi
            echo "Rules REST verify attempt $attempt/5 returned HTTP $HTTP_CODE" >&2
            sleep $((attempt * 10))
          done

          if [ "$VERIFY_OK" != "yes" ]; then
            echo "FIRESTORE_RULES_VERIFY_FAILED" >&2
            exit 1
          fi

          echo "FIRESTORE_RULES_DEPLOY_OK=rest"
      - name: Deploy Hosting
        run: npx -y firebase-tools@15.30.2 deploy --only hosting:nestjourney --project millionsnest --non-interactive
      - name: Smoke test Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://mn-nestjourney-555464791734.web.app/" -o /tmp/firebase-index.html
          grep -Eiq '<!doctype html|<html' /tmp/firebase-index.html
          grep -Fq '<title>NestJourney | MillionsNest</title>' /tmp/firebase-index.html
          test -s /tmp/firebase-index.html
          ASSET_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/firebase-index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$ASSET_PATH"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://mn-nestjourney-555464791734.web.app$ASSET_PATH" -o /tmp/firebase-app.js
          grep -Fq 'millionsnest.firebaseapp.com' /tmp/firebase-app.js
          grep -Fq '555464791734' /tmp/firebase-app.js
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 "https://nestjourney.millionsnest.com/" -o /tmp/custom-domain-index.html
          grep -Fq '<title>NestJourney | MillionsNest</title>' /tmp/custom-domain-index.html
          echo "FIREBASE_HOSTING_SMOKE_OK=NestJourney"
